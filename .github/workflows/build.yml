name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash test.sh
      - run: bash build.sh
      - run: test "$(lipo -archs build/Headroom.app/Contents/MacOS/Headroom)" = arm64

  release:
    name: Publish Apple Silicon app
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bash package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Download **Headroom.dmg**, open it, and drag Headroom into Applications.

          Requires an Apple Silicon Mac running macOS 13 or later. Sign into Claude Code with your Claude subscription before opening Headroom.

          This build is locally signed, not Apple-notarized. If macOS blocks the first launch, use System Settings → Privacy & Security → Open Anyway. See the repository README for installation and usage.

          Headroom forecasts outages and unused quota from account usage, including usage reflected by the server from other sessions. Predictions assume your recent pace continues.

          `Headroom.zip` is an alternative to the disk image. `SHA256SUMS` contains download checksums.
          NOTES
          gh release create "$GITHUB_REF_NAME" build/Headroom.dmg build/Headroom.zip build/SHA256SUMS --verify-tag --title "Headroom $GITHUB_REF_NAME" --generate-notes --notes-file build/release-notes.md

  homebrew:
    name: Publish Homebrew cask
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HEADROOM_TAP_DEPLOY_KEY: ${{ secrets.HEADROOM_TAP_DEPLOY_KEY }}
